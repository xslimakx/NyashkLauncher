[package]
name = "nyashklauncher"
version = "1.0.0"
edition = "2021"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "2", features = ["json", "native-certs"] }
zip = "9.1.3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
